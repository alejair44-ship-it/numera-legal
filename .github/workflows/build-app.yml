# Compila la app Zona Repostera desde app/ mientras vive en este repo.
# Cuando el código migre al repo dedicado zona-repostera-app, este workflow
# se elimina de aquí (allí ya existe app/.github/workflows/build.yml).
name: Build Zona Repostera

on:
  push:
    branches: [claude/zona-repostera-app-o7pzpj]
    paths: ['app/**', '.github/workflows/build-app.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Si los secrets del keystore existen, el APK/AAB sale firmado para
      # Play Store; si no, sale con firma debug (instalable directo).
      - name: Restaurar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=zona"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Keystore restaurado: build firmado para Play Store"
          else
            echo "Sin secrets de keystore: build con firma debug"
          fi
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: zona-repostera-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zona-repostera-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
