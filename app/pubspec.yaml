name: zona_repostera
description: "Zona Repostera - Administración, rentabilidad y CRM de alumnas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  share_plus: ^12.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla.ttf
        - asset: assets/fonts/Karla-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F7F1E8"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  remove_alpha_ios: true
