name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # APK instalable directo en cualquier Android (firma debug por ahora;
      # para Play Store configurar el keystore según docs/LANZAMIENTO.md).
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: zona-repostera-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zona-repostera-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios-sin-firma:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Compila iOS sin firma para validar que el proyecto construye.
      # El .ipa firmado para App Store requiere certificados (docs/LANZAMIENTO.md).
      - run: flutter build ios --release --no-codesign
